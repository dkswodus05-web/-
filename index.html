<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Invest Pro — Trading IDE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0e16;--panel:#0f1622;--card:#141d2b;--line:#222d3f;
  --txt:#dce4ee;--sub:#7a8aa0;--cyan:#22d3ee;--accent:#3b82f6;
  --buy:#16c47f;--sell:#ef4444;--hold:#f59e0b;
}
*{box-sizing:border-box;}
body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:13px;}
#app{display:grid;height:100vh;
  grid-template-columns:48px 1fr 1.1fr 0.9fr 1fr;
  grid-template-rows:42px 1fr 150px;
  grid-template-areas:
    "top top top top top"
    "side strat account notes chat"
    "side logs logs logs chat";}
/* 상단바 */
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:6px;}
.top .left{display:flex;align-items:center;gap:10px;}
.top .logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#3b82f6,#22d3ee);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;}
.top .engine{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid var(--line);
  display:inline-flex;align-items:center;}
.badge.stop{color:var(--sub);} .badge.dry{color:var(--hold);border-color:var(--hold);}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;flex:none;}
.icon-btn{display:inline-flex;align-items:center;gap:6px;}
.side .ic svg{display:block;}
.btn-engine{padding:6px 16px;border-radius:6px;border:none;background:var(--buy);color:#04130c;
  font-weight:800;font-size:12px;cursor:pointer;}
/* 사이드바 */
.side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:6px;}
.side .ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--sub);cursor:pointer;font-size:16px;}
.side .ic.on{background:var(--card);color:var(--cyan);}
/* 공통 패널 */
.pane{background:var(--panel);border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;}
.pane h3{margin:0;padding:10px 12px;font-size:11px;letter-spacing:.5px;color:var(--sub);
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);font-weight:700;}
.strat{grid-area:strat;} .account{grid-area:account;}
.notes{grid-area:notes;} .chat{grid-area:chat;border-right:none;}
.logs{grid-area:logs;background:var(--panel);border-top:1px solid var(--line);overflow:auto;}
.empty{color:var(--sub);text-align:center;padding:24px;font-size:12px;}
.pos{color:var(--buy);} .neg{color:var(--sell);}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;color:var(--sub);text-align:left;padding:6px 10px;font-weight:600;}
td{padding:7px 10px;border-top:1px solid var(--line);font-size:12px;}
.kv{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);}
.kv .k{color:var(--sub);font-size:11px;} .kv .v{font-weight:700;}
code{background:var(--card);padding:1px 5px;border-radius:4px;color:#93c5fd;}

/* ── 모바일: 그리드 대신 세로로 쌓기 ── */
@media (max-width: 860px){
  body{height:auto;overflow-y:auto;}
  #app{display:flex;flex-direction:column;height:auto;}
  .side{display:none;}
  .top{position:sticky;top:0;z-index:5;}
  .pane{border-right:none;border-bottom:1px solid var(--line);max-height:none;}
  .logs{border-top:none;}
  .chat{order:99;} /* 매매 내역은 맨 아래로 */
}
</style>
</head>
<body>
<div id="app">
  <!-- 상단바 -->
  <div class="top">
    <div class="left">
      <div class="logo">SI</div>
      <b>Signal Invest Pro</b>
      <span style="color:var(--sub);font-size:11px;">— Trading IDE (SPY/QQQ · Alpaca · FRED)</span>
    </div>
    <div class="engine">
      <span class="badge" id="modeBadge"><span class="dot" style="background:var(--sub)"></span>모드 확인 중...</span>
      <span class="badge stop" id="lastRunBadge">최근 실행: —</span>
      <span style="width:1px;height:18px;background:var(--line);margin:0 4px;"></span>
      <span id="railwayStatus" class="icon-btn" style="font-size:11px;color:var(--sub);">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a5 5 0 01-1-9.9 6 6 0 0111.5 1.9A4.5 4.5 0 0117.5 19z"/></svg>
        <span id="railwayStatusText">불러오는 중...</span>
      </span>
      <button class="btn-engine icon-btn" id="btnRailwayConfig" style="background:var(--accent);color:#fff;">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 017 7h2"/><path d="M15 7h2a5 5 0 010 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        연동
      </button>
      <button class="btn-engine icon-btn" id="btnRailwayRefresh" style="background:var(--card);color:var(--cyan);border:1px solid var(--line);justify-content:center;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.13-3.36L23 10M1 14l5.36 4.36A9 9 0 0020.49 15"/></svg>
      </button>
    </div>
  </div>

  <!-- 사이드바 -->
  <div class="side">
    <div class="ic on" title="전략">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>
    </div>
    <div class="ic" title="포트폴리오">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="12"/><line x1="12" y1="20" x2="12" y2="7"/><line x1="19" y1="20" x2="19" y2="4"/></svg>
    </div>
    <div class="ic" title="계정">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.87 3.13-6 7-6s7 2.13 7 6"/></svg>
    </div>
  </div>

  <!-- 전략 -->
  <div class="pane strat">
    <h3>ACTIVE STRATEGY (활성 전략)</h3>
    <div id="stratBody"></div>
  </div>

  <!-- 계좌 + 보유종목 + 관심종목 -->
  <div class="pane account">
    <h3>MY ACCOUNT (계좌)</h3>
    <div id="accountBody"></div>
    <h3>자산 추이 (계좌 히스토리)</h3>
    <div style="padding:10px 12px;"><canvas id="equityChart" height="110"></canvas></div>
    <h3>CURRENT HOLDINGS (보유 종목)</h3>
    <div id="holdingsBody"></div>
    <h3>WATCHLIST (관심 종목 · SPY/QQQ)</h3>
    <div id="watchBody"></div>
  </div>

  <!-- 마스터 프롬프트 / 신호 -->
  <div class="pane notes">
    <h3>AI 신호 & 마스터 프롬프트</h3>
    <div id="notesBody"></div>
  </div>

  <!-- 매매 내역 -->
  <div class="pane chat">
    <h3>TRADE HISTORY (매매 내역)</h3>
    <div id="tradeHistoryBody"></div>
  </div>

  <!-- 시스템 로그 -->
  <div class="pane logs">
    <h3>SYSTEM LOGS (trades.log)</h3>
    <div id="logsBody"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let signalData=null, indData=null, accountHistory=[], tradeHistory=[], equityChartInstance=null;
const MIN_CONF=60;

// 이 프로젝트의 상태 공유 Gist 기본값 (daily_pipeline.py가 자동 갱신).
// 다른 Gist를 쓰고 싶을 때만 "🔗 연동"으로 덮어쓰면 됨.
const DEFAULT_GIST_ID="d6e06c315bb709e6533ee3a369684761";

// ── Railway 연동 (GitHub Gist로 공유된 최신 상태 자동으로 불러오기) ──
const GIST_KEY="sip_gist_url";
function parseGistUrl(url){
  // https://gist.github.com/USER/GISTID 또는 https://gist.github.com/GISTID 둘 다 지원 (ID만 추출)
  const m=(url||"").match(/gist\.github(?:usercontent)?\.com\/(?:[^/\s]+\/)?([0-9a-f]{16,})/i);
  return m?{id:m[1]}:null;
}
async function fetchGistData(id){
  const url=`https://api.github.com/gists/${id}?t=${Date.now()}`;
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error("gist 조회 실패 ("+r.status+")");
  return r.json();
}
async function refreshFromRailway(){
  const saved=localStorage.getItem(GIST_KEY);
  const info=parseGistUrl(saved) || (DEFAULT_GIST_ID?{id:DEFAULT_GIST_ID}:null);
  const statusEl=$("railwayStatus"), statusText=$("railwayStatusText");
  if(!info){ statusText.textContent="Railway 연동 안 됨"; statusEl.style.color="var(--sub)"; return; }
  statusText.textContent="불러오는 중..."; statusEl.style.color="var(--hold)";
  try{
    const data=await fetchGistData(info.id);
    const files=data.files||{};
    if(files["signal.json"]){ try{signalData=JSON.parse(files["signal.json"].content);}catch(e){} }
    if(files["indicators.json"]){ try{indData=JSON.parse(files["indicators.json"].content);}catch(e){} }
    if(files["trades.log"]){ renderLogs(files["trades.log"].content); }
    if(files["account_history.json"]){ try{accountHistory=JSON.parse(files["account_history.json"].content)||[];}catch(e){accountHistory=[];} }
    if(files["trade_history.json"]){ try{tradeHistory=JSON.parse(files["trade_history.json"].content)||[];}catch(e){tradeHistory=[];} }
    renderStrat(); renderNotes(); renderWatch(); renderAccount(); renderEquityChart(); renderTradeHistory(); renderEngineStatus();
    const now=new Date().toLocaleTimeString("ko-KR");
    statusText.textContent=`Railway 연동됨 · ${now} 갱신`; statusEl.style.color="var(--buy)";
  }catch(e){
    statusText.textContent="불러오기 실패"; statusEl.style.color="var(--sell)";
  }
}
$("btnRailwayConfig").addEventListener("click",()=>{
  const cur=localStorage.getItem(GIST_KEY)||"";
  const input=prompt("다른 Gist 주소로 바꾸고 싶을 때만 입력하세요. 비워두면 기본값을 씁니다.\n(https://gist.github.com/gistid 형태)",cur);
  if(input===null)return;
  if(input.trim()===""){ localStorage.removeItem(GIST_KEY); }
  else{
    if(!parseGistUrl(input)){ alert("Gist 주소 형식을 확인해주세요."); return; }
    localStorage.setItem(GIST_KEY,input.trim());
  }
  refreshFromRailway();
});
$("btnRailwayRefresh").addEventListener("click",refreshFromRailway);

// ── 계좌 (account_history.json의 최신 항목 = 실제 파이프라인 실행 결과) ──
function renderAccount(){
  if(!accountHistory.length){
    $("accountBody").innerHTML=`<div class="empty">아직 계좌 기록이 없습니다<br><span style="font-size:11px">파이프라인이 한 번 더 실행되면 표시됩니다</span></div>`;
    $("holdingsBody").innerHTML=`<div class="empty">보유 종목 정보 없음</div>`;
    return;
  }
  const latest=accountHistory[accountHistory.length-1];
  const prev=accountHistory.length>1?accountHistory[accountHistory.length-2]:null;
  const equity=+latest.equity||0, cash=+latest.cash||0;
  const base=prev?(+prev.equity||equity):equity;
  const pl=equity-base;
  const plPct=base?(pl/base*100):0;
  const modeColor=/DRY/.test(latest.mode||"")?"var(--hold)":/PAPER/.test(latest.mode||"")?"var(--cyan)":"var(--sell)";
  $("accountBody").innerHTML=`
    <div class="kv"><span class="k">총 자산</span><span class="v">$${equity.toLocaleString(undefined,{maximumFractionDigits:0})}</span></div>
    <div class="kv"><span class="k">손익 (전회 대비)</span><span class="v ${pl>=0?'pos':'neg'}">${pl>=0?'+':''}$${pl.toLocaleString(undefined,{maximumFractionDigits:0})} (${plPct>=0?'+':''}${plPct.toFixed(2)}%)</span></div>
    <div class="kv"><span class="k">현금</span><span class="v">$${cash.toLocaleString(undefined,{maximumFractionDigits:0})}</span></div>
    <div class="kv"><span class="k">모드</span><span class="v" style="color:${modeColor}">${latest.mode||"—"}</span></div>
    <div class="kv"><span class="k">최근 갱신</span><span class="v" style="font-size:11px;font-weight:400;color:var(--sub)">${latest.ts?new Date(latest.ts).toLocaleString("ko-KR"):"—"}</span></div>`;
  const qty=+latest.holding_qty||0;
  if(qty>0){
    $("holdingsBody").innerHTML=`<table><tr><th>종목</th><th>수량</th></tr><tr><td><b>${latest.symbol||"-"}</b></td><td>${qty}</td></tr></table>`;
  } else {
    $("holdingsBody").innerHTML=`<div class="empty">보유 종목 없음 (현금)</div>`;
  }
}

// ── 자산 추이 그래프 (Chart.js) ──
function renderEquityChart(){
  const canvas=$("equityChart");
  if(!canvas||typeof Chart==="undefined")return;
  const labels=accountHistory.map(h=>h.ts?new Date(h.ts).toLocaleDateString("ko-KR",{month:"2-digit",day:"2-digit"}):"");
  const data=accountHistory.map(h=>+h.equity||null);
  if(equityChartInstance){ equityChartInstance.destroy(); equityChartInstance=null; }
  if(!accountHistory.length)return;
  equityChartInstance=new Chart(canvas.getContext("2d"),{
    type:"line",
    data:{labels, datasets:[{
      label:"자산(equity)", data,
      borderColor:"#22d3ee", backgroundColor:"rgba(34,211,238,.12)",
      borderWidth:2, tension:.25, pointRadius:2, fill:true,
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:"#7a8aa0",font:{size:9}},grid:{color:"#222d3f"}},
        y:{ticks:{color:"#7a8aa0",font:{size:9}},grid:{color:"#222d3f"}},
      },
    },
  });
  canvas.parentElement.style.height="130px";
}

// ── 매매 내역 (trade_history.json) ──
function renderTradeHistory(){
  if(!tradeHistory.length){
    $("tradeHistoryBody").innerHTML=`<div class="empty" style="padding:24px;">아직 매매 기록이 없습니다<br><span style="font-size:11px">BUY/SELL이 실제 실행되면 여기 쌓입니다</span></div>`;
    return;
  }
  const rows=[...tradeHistory].reverse().slice(0,100);
  let html='<table><tr><th>시각</th><th>종목</th><th>액션</th><th>금액</th><th>상태</th></tr>';
  html+=rows.map(t=>{
    const c=t.action==="BUY"?"var(--buy)":"var(--sell)";
    const ts=t.ts?new Date(t.ts).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
    const notional=t.notional?`$${(+t.notional).toLocaleString(undefined,{maximumFractionDigits:0})}`:"—";
    return `<tr><td style="font-size:10px;color:var(--sub);white-space:nowrap;">${ts}</td><td>${t.symbol||"-"}</td>`+
      `<td style="color:${c};font-weight:700;">${t.action}</td><td>${notional}</td>`+
      `<td style="font-size:10px;color:var(--sub);">${t.status||""}</td></tr>`;
  }).join("");
  html+="</table>";
  $("tradeHistoryBody").innerHTML=html;
}

// ── 전략 ──
function renderStrat(){
  if(!signalData){ $("stratBody").innerHTML=`<div class="empty">signal.json을 불러오면<br>활성 전략이 표시됩니다</div>`; return; }
  const sig=(signalData.signal||"HOLD").toUpperCase();
  const conf=+signalData.confidence||0;
  const sym=signalData.symbol||"SPY";
  const color=sig==="BUY"?"var(--buy)":sig==="SELL"?"var(--sell)":"var(--hold)";
  let gate;
  if(sig==="SELL")gate="🛡 청산은 항상 허용";
  else if(sig==="HOLD")gate="🛡 관망 — 동작 없음";
  else if(conf<MIN_CONF)gate=`🛡 확신도 ${conf}<${MIN_CONF} → 매수 보류`;
  else gate=`🛡 확신도 ${conf}≥${MIN_CONF} → 게이트 통과 시 매수`;
  $("stratBody").innerHTML=`
    <div style="margin:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b style="font-size:18px;">${sym}</b>
        <span style="padding:4px 12px;border-radius:999px;font-weight:800;color:${color};border:1.5px solid ${color};">${sig}</span>
      </div>
      <div style="margin:12px 0 6px;font-size:11px;color:var(--sub);">AI 확신도 ${conf}/100</div>
      <div style="height:7px;background:var(--bg);border-radius:5px;overflow:hidden;">
        <div style="height:100%;width:${conf}%;background:${color};"></div></div>
      ${signalData.note?`<div style="margin-top:10px;font-size:12px;color:var(--sub);line-height:1.5;">💬 ${signalData.note}</div>`:""}
      <div style="margin-top:10px;font-size:11px;padding:7px 9px;background:rgba(59,130,246,.1);border-radius:7px;color:#93c5fd;">${gate}</div>
      <div style="margin-top:8px;font-size:10px;color:var(--sub);">생성: ${signalData.created_at||"-"}</div>
    </div>`;
}

// ── 관심종목 (지표 기반 SPY/QQQ) ──
function renderWatch(){
  const g=n=>{if(!indData)return null;const k=Object.keys(indData.indicators||{}).find(x=>x.includes(n));return k?indData.indicators[k].value:null;};
  const vix=g("VIX"), sp=g("S&P500");
  const rows=[["SPY","S&P 500",sp], ["QQQ","Nasdaq 100",null]];
  let html='<table><tr><th>티커</th><th>이름</th><th>참고</th></tr>';
  html+=rows.map(r=>`<tr><td><b>${r[0]}</b></td><td style="color:var(--sub)">${r[1]}</td><td>${r[2]!=null?r[2]:"—"}</td></tr>`).join("");
  html+="</table>";
  if(vix!=null)html+=`<div style="padding:8px 12px;font-size:11px;color:var(--sub);">VIX ${vix} · ${vix<20?"안정":vix>30?"공포":"보통"}</div>`;
  $("watchBody").innerHTML=html;
}

// ── 마스터 프롬프트 / 지표 ──
function renderNotes(){
  let html="";
  if(indData&&indData.indicators){
    const got=Object.values(indData.indicators).filter(v=>v.value!=null).length;
    const tot=Object.keys(indData.indicators).length;
    html+=`<div style="padding:8px 12px;font-size:11px;color:var(--sub);">데이터 수집 ${got}/${tot} · ${indData.collected_at?.slice(0,10)||""}</div>`;
    html+='<table><tr><th>지표</th><th>값</th></tr>';
    html+=Object.entries(indData.indicators).slice(0,17).map(([k,v])=>
      `<tr><td style="color:var(--sub);font-size:11px;">${k}</td><td>${v.value!=null?v.value:"—"}</td></tr>`).join("");
    html+="</table>";
  } else {
    html=`<div style="margin:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--sub);line-height:1.6;">
      <b style="color:var(--txt)">마스터 프롬프트</b><br>
      AI 투자위원회가 매일 17개 매크로 지표를 분석합니다.<br><br>
      indicators.json을 불러오면 지표 상세가 여기 표시됩니다.</div>`;
  }
  $("notesBody").innerHTML=html;
}

// ── 시스템 로그 ──
function renderLogs(text){
  const lines=(text||"").split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length){ $("logsBody").innerHTML=`<div class="empty">로그 없음</div>`; return; }
  $("logsBody").innerHTML='<table>'+lines.slice(-200).reverse().map(l=>{
    const m=l.match(/^\[(.*?)\]\s*(.*)$/);
    const ts=m?m[1]:""; const msg=m?m[2]:l;
    let c="var(--sub)";
    if(/🟢|✅ 허용/.test(msg))c="var(--buy)";
    else if(/🔴|⛔|실패/.test(msg))c="var(--sell)";
    else if(/⏸|보류|⚠️/.test(msg))c="var(--hold)";
    return `<tr><td style="color:var(--sub);font-size:10px;white-space:nowrap;">${ts}</td><td style="color:${c};font-size:11px;">${msg}</td></tr>`;
  }).join("")+'</table>';
}

// ── 실제 실행 상태 배지 (account_history.json의 최신 항목 기반 — 표시만 하고 아무 것도 제어하지 않음) ──
// 실제 자동매매는 이 화면과 무관하게 Railway Cron 스케줄로 매일 실행된다.
function renderEngineStatus(){
  const modeBadge=$("modeBadge"), lastRunBadge=$("lastRunBadge");
  if(!accountHistory.length){
    modeBadge.innerHTML=`<span class="dot" style="background:var(--sub)"></span>실행 기록 없음`;
    modeBadge.style.color="var(--sub)"; modeBadge.style.borderColor="var(--line)";
    lastRunBadge.textContent="최근 실행: —";
    return;
  }
  const latest=accountHistory[accountHistory.length-1];
  const mode=latest.mode||"—";
  const color=/DRY/.test(mode)?"var(--hold)":/PAPER/.test(mode)?"var(--cyan)":"var(--sell)";
  modeBadge.innerHTML=`<span class="dot" style="background:${color}"></span>${mode}`;
  modeBadge.style.color=color; modeBadge.style.borderColor=color;
  lastRunBadge.textContent=`최근 실행: ${latest.ts?new Date(latest.ts).toLocaleString("ko-KR"):"—"}`;
}

// 초기 렌더
renderAccount(); renderStrat(); renderNotes(); renderWatch(); renderEquityChart(); renderTradeHistory(); renderEngineStatus();

refreshFromRailway();
setInterval(refreshFromRailway, 5*60*1000); // 5분마다 자동 새로고침
</script>
